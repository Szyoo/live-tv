name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Unit tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "LIVE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          LIVE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LIVE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LIVE_DEFAULT_URL: ${{ secrets.LIVE_DEFAULT_URL }}
        run: |
          bash ./gradlew :app:assembleRelease --no-daemon \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            -PdefaultSourceUrl="$LIVE_DEFAULT_URL"
          cp app/build/outputs/apk/release/app-release.apk live-tv.apk

      - name: Generate update.json
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          notes = subprocess.run(["git", "log", "-1", "--pretty=%s"], capture_output=True, text=True).stdout.strip()
          name = os.environ["VERSION_NAME"]
          json.dump({
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": name,
              "apk": f"https://github.com/${{ github.repository }}/releases/download/v{name}/live-tv.apk",
              "notes": notes,
          }, open("update.json", "w"), ensure_ascii=False)
          PY
          cat update.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" live-tv.apk update.json \
            --title "v$VERSION_NAME" --notes "自动构建 #$VERSION_CODE" --latest
